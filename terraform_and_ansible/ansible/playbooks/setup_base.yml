---
- name: Cài đặt Docker và các công cụ cơ bản
  hosts: all
  become: true
  tasks:
    - name: Cập nhật apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Cài đặt các gói phụ thuộc
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
        state: present

    - name: Tạo thư mục chứa keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Thêm Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        keyring: /etc/apt/keyrings/docker.gpg
        state: present

    - name: Thêm Docker repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Cài đặt Docker và Docker Compose Plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Đảm bảo Docker service đang chạy và tự bật khi boot
      service:
        name: docker
        state: started
        enabled: yes

    - name: Cấp quyền chạy docker cho user ubuntu
      user:
        name: ubuntu
        groups: docker
        append: yes